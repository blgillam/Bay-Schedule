<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mission">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Mission Division field schedule tracker">
<title>Mission Division — Field Schedule</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- React 18 UMD (pre-compiled app.js means no Babel runtime needed) -->
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<style>
  html, body, #root { height: 100%; margin: 0; padding: 0; background: #0d1117; }
  body { font-family: 'Barlow', -apple-system, sans-serif; color: #e6edf3; overscroll-behavior: none; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; color: #8b949e; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 1px; }
  #boot .spin { width: 24px; height: 24px; border: 2px solid #30363d; border-top-color: #f78166; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Safe-area insets for iPhone */
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
</style>
</head>
<body>
<div id="root">
  <div id="boot">
    <div class="spin"></div>
    <div>LOADING SCHEDULE…</div>
  </div>
</div>

<script src="./app.js"></script>

<script>
  // Mount hook + service worker registration
  window.addEventListener('load', () => {
    // Clear boot spinner once React renders
    const boot = document.getElementById('boot');
    const check = setInterval(() => {
      const root = document.getElementById('root');
      if (root && root.children.length > 0 && root.children[0].id !== 'boot') {
        clearInterval(check);
      }
    }, 100);

    // Register service worker for PWA / offline
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => {
        console.warn('SW registration failed:', err);
      });
    }
  });
</script>
</body>
</html>
